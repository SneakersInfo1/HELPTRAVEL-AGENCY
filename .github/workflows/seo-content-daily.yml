name: SEO content engine (offline)

# Ręczny test silnika treści NA DANYCH TESTOWYCH (FakeLlm, źródła z fixture).
#
# Od 17.11.2026 praca SEO odbywa się w sesji Claude Code uruchamianej ręcznie przez
# właściciela (`/seo-daily`), w ramach abonamentu: docs/seo/daily/README.md.
# Ten workflow celowo:
#  • NIE ma harmonogramu (`schedule`) — nic nie generuje treści automatycznie;
#  • NIE ma ścieżki z kluczem API modelu — żadne płatne wywołanie API modelu AI
#    nie jest możliwe z poziomu CI;
#  • NIE tworzy gałęzi, PR ani gałęzi stanu — tylko uruchamia scenariusz offline
#    i zapisuje publiczny raport jako artefakt.
# Dawny dzienny automat (harmonogram + klucz API) jest w historii gita i opisany
# w docs/seo/AUTOMATION_RUNBOOK.md jako wyłączona alternatywa.

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenariusz offline (FakeLlm, źródła z fixture)
        required: true
        default: refresh
        type: choice
        options:
          - refresh
          - new-evergreen
          - reject-unverified

concurrency:
  group: seo-content-engine-offline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  content-engine-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run content tests
        run: node --import tsx --test "src/lib/content-engine/**/*.test.ts" "src/lib/content-quality/**/*.test.ts"

      - name: Run offline scenario
        shell: bash
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          scheduled_at="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          pnpm exec tsx scripts/content-engine/run.ts --mode dry-run --scenario "$SCENARIO" \
            --scheduled-at "$scheduled_at" --state-dir "$RUNNER_TEMP/seo-engine-state" \
            --store-dir content/seo --public-report "$RUNNER_TEMP/seo-run-report.public.json"

      - name: Upload public run report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seo-run-report-offline
          path: ${{ runner.temp }}/seo-run-report.public.json
          if-no-files-found: ignore
          retention-days: 14
